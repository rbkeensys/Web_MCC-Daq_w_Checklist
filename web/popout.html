<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Widget</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    /* Popout window is JUST the widget — no toolbar, no sidebar, no page tabs.
       The popout body becomes a single positioning context that holds one
       widget filling the entire viewport. */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      background: var(--bg);
      overflow: hidden;
    }
    #popout-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    /* The single widget inside a popout fills the whole window. We disable
       absolute positioning rules from .widget so it just stretches edge-to-edge. */
    #popout-canvas > .widget {
      position: absolute !important;
      left: 0 !important;
      top: 0 !important;
      width: 100% !important;
      height: 100% !important;
    }
    /* Checklist-popout case: the dock fills the window. The dock normally
       has its own absolute positioning + size; we override here so it
       behaves like the widget popouts above (full-bleed, no chrome around
       it from the popout viewport). */
    body.cl-popout #clDock {
      position: absolute !important;
      inset: 0 !important;
      top: 0 !important; left: 0 !important;
      width: 100% !important; height: 100% !important;
      max-width: none !important; max-height: none !important;
      border-radius: 0 !important;
      resize: none !important;
    }
    /* In popout mode the window IS the dock — the table wrap should
       absorb whatever space the dock has (the numRows-based clamp
       _clRefitWindow puts on the wrap doesn't apply here because the
       user resizes by dragging the window border, not by setting rows). */
    body.cl-popout #clDock #clTableWrap {
      height: auto !important;
      max-height: none !important;
      flex: 1 !important;
    }
  </style>
</head>
<body>
  <div id="popout-canvas"></div>
  <!-- Order matters: checklist_widget.js declares the globals and the
       _clSelfMount() machinery; app.js's popout init reuses them for the
       ?popout=checklist case. Both files are needed in either popout type
       since the regular widget popouts may include checklist-derived state. -->
  <script src="/checklist_widget.js"></script>
  <script src="/app.js"></script>
</body>
</html>
