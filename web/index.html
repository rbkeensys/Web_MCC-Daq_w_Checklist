<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <title>MCC Web Control</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <!-- Exit fullscreen button - only visible in fullscreen mode -->
  <button id="exitFullscreenBtn" class="btn">✕ Exit Fullscreen (F11)</button>
  
  <!-- Reveal tab for the hidden menu bar (kiosk): tiny, translucent, top-right -->
  <button id="tbShowBtn" title="Show menu bar">&#9662;</button>
  <header class="topbar">
    <div class="left">
      <button id="connectBtn" class="btn">Connect</button>
      <label>Rate Hz <input id="rate" type="number" min="1" step="1" value="100" style="width:48px"></label>
      <button id="setRate" class="btn">Set</button>
      <span id="session" class="badge"></span>
      <span id="versions" class="muted"></span>
    </div>
    <div class="right">
      <button id="uiEditToggle" class="btn ui-edit-toggle" title="Click to unlock the layout for moving/resizing widgets">🔒 Locked</button>
      <button id="fullscreenBtn" class="btn" title="Toggle Fullscreen (F11)">⛶</button>
      <button id="oskBtn" class="btn" title="Toggle the on-screen keyboard on the rig display (kiosk)">⌨</button>
      <button id="gridBtn" class="btn" title="Layout grid settings (snap-to-grid for widget placement)">⊞ Grid</button>
      <button id="editConfig" class="btn">Config</button>
      <button id="zeroAI" class="btn" title="Zero AI Channels" onclick="openZeroAIDialog()">⚡ Zero</button>
      <button id="calibrateAI" class="btn" title="Calibrate AI Channels" onclick="openCalibrateAIDialog()">📐 Calibrate</button>
      <button id="editPID" class="btn">PID</button>
      <button id="editVFD" class="btn">MOD Drv</button>
      <button id="editScales" class="btn">Scales</button>
      <button id="editExpr" class="btn">Expressions</button>
      <button id="editSim" class="btn" title="Simulator: simulate inputs / hardware-in-the-loop">Sim</button>
      <button id="exprHelp" class="btn" title="Expression Language Reference">❓ Expr Help</button>
      <button id="editScript" class="btn">Script</button>
      <button id="clToggleBtn" class="btn" title="Open Checklist Editor">📋 CL Editor</button>
      <button id="saveLayout" class="btn">Save Layout</button>
      <button id="loadLayout" class="btn">Load Layout</button>
      <button id="openLogBtn" type="button" class="btn">Open Log</button>
      <button id="viewerBtn" type="button" class="btn" title="Launch the standalone Python log viewer — handles huge files the browser can't">🖥 Viewer</button>
      <button id="mergeChkBtn" type="button" class="btn" title="Merge a session's chk.json check events into its CSV (recovery for sessions where the server was terminated)">🔗 Merge chk</button>
      <button id="closeLogBtn" type="button" class="btn">Start New Log</button>
      <button id="closeUiBtn" type="button" class="btn" title="Close THIS browser on the server machine (the rig kiosk display)">Close UI</button>
      <button id="fitBtn" type="button" class="btn" title="Zoom the whole dashboard to fit the window (applies while locked; released during layout editing)">&#10530; Fit</button>
      <button id="tbHideBtn" type="button" class="btn" title="Hide this menu bar &mdash; a small &#9662; tab at the top-right brings it back">&#9652;</button>
    </div>
  </header>

  <!-- Replay Controls (hidden by default) -->
  <div id="replayControls" class="replay-controls" style="display:none">
  <div class="replay-left">
    <button id="replayPlayBtn" class="btn" title="Play Log">▶ Play</button>
    <button id="replayPauseBtn" class="btn" title="Pause" disabled>⏸ Pause</button>
    <button id="replayShowFullBtn" class="btn" title="Show Full Log">📊 Full Log</button>
    <button id="replayCloseBtn" class="btn danger" title="Close Log">✕ Close Log</button>
    <span id="replayPosition" class="badge">0 / 0</span>
    <span id="replayFileName" style="font-size:11px;color:#79c0ff;margin:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:300px;" title="Loaded log file"></span>
    <input
      id="replayProgress"
      type="range"
      min="0"
      max="100"
      value="0"
      style="flex:1;margin:0 12px"
      title="Scrub through log (updates gauges/bars)"
    />
  </div>
  <div class="replay-right">
    <label style="display:flex;align-items:center;gap:6px">
      Playback Rate (Hz):
      <input
        id="replayRateInput"
        type="number"
        min="1"
        max="1000"
        step="10"
        value="60"
        style="width:70px"
      />
    </label>
  </div>
</div>
<!-- Script Player Controls -- HIDDEN (russ 7/24: scripting moved to expressions; bar removed from all UIs, code intact) -->
<div class="script-controls" style="display:none">
  <div class="script-left">
    <button id="scriptRewindBtn" class="btn" title="Rewind to Start" disabled>⏮ Rewind</button>
    <button id="scriptPlayBtn" class="btn" title="Play Script">▶ Play</button>
    <button id="scriptPauseBtn" class="btn" title="Pause Script" disabled>⏸ Pause</button>
    <button id="scriptStopBtn" class="btn" title="Stop Script" disabled>⏹ Stop</button>
    <span id="scriptStatus" class="badge">No script loaded</span>
  </div>
</div>
  <main class="workspace">
    <!-- Click to slide the widgets/pages panel in or out. The chevron flips
         to indicate the action (◄ when palette is open, ► when collapsed).
         Position follows the palette's right edge via the .palette-collapsed
         class on <main>. -->
    <button id="paletteToggle" class="palette-toggle" title="Hide widgets panel" aria-label="Toggle panel">◄</button>
    <aside class="palette">
      <h3>Widgets</h3>
      <button class="btn" data-add="chart">Chart</button>
      <button class="btn" data-add="gauge">Gauge</button>
      <button class="btn" data-add="bars">Bars</button>
      <button class="btn" data-add="aoslider">AO Slider</button>
      <button class="btn" data-add="dobutton">DO Button</button>
      <button class="btn" data-add="pidpanel">PID Panel</button>
      <button class="btn" data-add="drive" title="VFD or stepper — pick the type in settings">MOD Drv</button>
      <button class="btn" data-add="le">Logic Element</button>
      <button class="btn" data-add="mathop">Math Operator</button>
      <button class="btn" data-add="expr">Expression</button>
      <button class="btn" data-add="staticvar">📊 Static Var</button>
      <button class="btn" data-add="indicator" title="Small status dot/rect (right-click to edit)">🔘 Indicator</button>
      <button class="btn" data-add="label" title="Plain text label — pick font, size, colors (right-click to edit)">🏷️ Label</button>
      <button class="btn" data-add="statustext" title="Conditional status text — shows per-condition text/colors for a signal value (right-click to edit)">🚦 Status</button>
      <button class="btn" data-add="shape" title="Drawing aid: lines, circles, polygons (right-click to edit)">▱ Shape</button>
      <button class="btn" data-add="console" title="Mirror of server stdout/stderr">🖥 Console</button>
      <button class="btn" id="clOpenDockBtn" title="Open Checklist Widget">📋 Checklist</button>
      <h3>Pages</h3>
      <div id="pages"></div>
      <div class="page-controls">
        <button id="addPage" class="btn">+ Add Page</button>
        <button id="delPage" class="btn danger">∓ Remove Page</button>
      </div>
    </aside>
    <section class="canvas" id="canvas"></section>
  </main>

  <div id="modal" class="modal hidden"></div>
  <script src="/checklist_widget.js" defer></script>
  <script src="/checklist_editor.js" defer></script>
  <script src="/app.js" defer></script>
</body>
</html>
